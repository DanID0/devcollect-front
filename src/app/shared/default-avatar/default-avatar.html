@if(auth.currentUser()?.avatarUrl == null){
    <svg
    class="h-9 w-9 text-gray-400"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
>
    <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 19.5a7.5 7.5 0 0115 0"
    />
</svg> 
}

@else{
    <img [src]="auth.currentUser()?.avatarUrl" alt="" class="size-10 object-cover" />
}
