<section class="w-screen h-screen flex">

    <!-- Left side -->
    <div class="w-1/2 flex flex-col justify-center items-center">
  
      <h2 class="text-3xl">Sign Up</h2>
  
      <div class="mt-12 flex flex-col gap-4">
  
        <div class="w-96 h-11">
          <input
            type="text"
            [formField]="signupForm.username"
            class="border-2 rounded w-full h-full px-3"
            placeholder="your username"
          />
        </div>
  
        <div class="relative w-96 h-11">

            <span class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="18" viewBox="0 0 22 18" fill="none">
                <path d="M21.5001 2.15001C21.5001 0.967503 20.5326 0 19.3501 0H2.15001C0.967503 0 0 0.967503 0 2.15001V15.05C0 16.2325 0.967503 17.2001 2.15001 17.2001H19.3501C20.5326 17.2001 21.5001 16.2325 21.5001 15.05V2.15001ZM19.3501 2.15001L10.75 7.52502L2.15001 2.15001H19.3501ZM19.3501 15.05H2.15001V4.30001L10.75 9.67503L19.3501 4.30001V15.05Z" fill="#ADB0CD"/>
              </svg>
            </span>
          

            <input
              type="email"
              [formField]="signupForm.email"
              class="border-2 rounded w-full h-full pl-10 pr-3"
              placeholder="your email"
            />
          </div>
  
        <div class="w-96 h-11">
          <input
            type="password"
            [formField]="signupForm.password"
            class="border-2 rounded w-full h-full px-3"
            placeholder="your password"
          />
        </div>
  
        <button
          type="submit"
          class="h-11 rounded bg-blue-500 text-white"
          (click) = "onSubmit()"
        >
          Sign Up
        </button>
      </div>
    <div class="flex flex-row gap-2">
        <p>Already have an account ? </p>
      <a routerLink = "/login" class="text-blue-600">
    Sign In
      </a>
    </div>
</div>
  

    <div class="w-1/2">
        <img src="/Rectangle 2775.png" class="h-screen w-full" alt="Login image"/>  
    </div>
  
  </section>
